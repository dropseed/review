<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <!-- Fallback for browsers that ignore the media-scoped tags above; it has to
         come last, since the first matching tag wins. -->
    <meta name="theme-color" content="#0c0a09" />
    <!-- PWA (web mode). Inert under Tauri: the manifest is never fetched by the
         webview, and the service worker is not registered there (see ui/utils/register-sw.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` draws the app *under* the iOS status bar, which needs
         env(safe-area-inset-*) padding in the app shell before it stops overlapping
         (deferred to the responsive pass); viewport-fit=cover above already allows it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Review" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-180.png"
    />
    <title>Review</title>
    <style>
      html, body { background-color: #0c0a09; margin: 0; height: 100%; }
      @media (prefers-color-scheme: light) {
        html, body { background-color: #fafaf9; }
      }
      /* Loading indicator - replaced when React mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loader .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid #44403c;
        border-top-color: #84cc16;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: light) {
        #initial-loader .spinner {
          border-color: #d6d3d1;
          border-top-color: #65a30d;
        }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="text-neutral-100">
    <div id="initial-loader"><div class="spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
