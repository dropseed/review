[package]
name = "review-desktop"
version = "0.0.146"
description = "A diff review desktop app"
license = "FSL-1.1-MIT"
edition = "2021"
default-run = "review-desktop"

[lib]
name = "review_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core library
# `terminal-types` is the wire contract only (TerminalSummary, SessionStatus) —
# the PTYs themselves live in the `review-daemon` process, which this app talks
# to through `daemon-client`, so none of the PTY crates are linked here.
review = { path = "../../core", features = [
    "symbols-dev",
    "lsp",
    "terminal-types",
    "daemon-client",
] }

# Tauri and plugins
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
url = "2"

# Desktop-specific dependencies
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
tokio = { version = "1", features = [
    "time",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "process",
] }
notify = "6.0"
notify-debouncer-mini = "0.4"
ignore = "0.4"
chrono = "0.4"
sentry = "0.35"
dirs = "6"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-drag = "2"

[features]
default = []
symbols-all = ["review/symbols-all"]

[lints]
workspace = true
