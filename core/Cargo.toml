[package]
name = "review"
version = "0.0.151"
description = "A diff review library and CLI"
license = "FSL-1.1-MIT"
edition = "2021"

[lib]
name = "review"
path = "src/lib.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
glob = "0.3"
urlencoding = "2"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "io-util", "process", "signal", "net"] }
futures = "0.3"
base64 = "0.22"
ignore = "0.4"
regex = "1"
dirs = "6"
tempfile = "3"
anyhow = "1"

# Server dependencies (feature-gated)
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-stream = { version = "0.1", optional = true }
notify = { version = "7", optional = true }
notify-debouncer-mini = { version = "0.5", optional = true }
env_logger = { version = "0.11", optional = true }

# Tree-sitter for symbol extraction
tree-sitter = "0.25"

# Grammar crates (all optional, gated by features)
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-md = { version = "0.3", optional = true }

# Terminal sessions (feature-gated)
portable-pty = { version = "0.8", optional = true }
vte = { version = "0.13", optional = true }
nix = { version = "0.29", features = ["term", "process"], optional = true }
bytes = { version = "1", optional = true }
# VT screen engine — Ghostty's own terminal core. Native, built from the
# `vendor/ghostty` submodule by zig; see CLAUDE.md → "Terminal VT engine".
libghostty-vt = { version = "0.2.1", optional = true }

# LSP client (feature-gated)
lsp-types = { version = "0.97", optional = true }

# CLI dependencies (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
symbols-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
symbols-rust-lang = ["dep:tree-sitter-rust"]
symbols-python = ["dep:tree-sitter-python"]
symbols-go = ["dep:tree-sitter-go"]
symbols-ruby = ["dep:tree-sitter-ruby"]
symbols-java = ["dep:tree-sitter-java"]
symbols-c = ["dep:tree-sitter-c"]
symbols-cpp = ["dep:tree-sitter-cpp"]
symbols-csharp = ["dep:tree-sitter-c-sharp"]
symbols-php = ["dep:tree-sitter-php"]
symbols-css = ["dep:tree-sitter-css"]
symbols-html = ["dep:tree-sitter-html"]
symbols-markdown = ["dep:tree-sitter-md"]
symbols-dev = ["symbols-typescript", "symbols-rust-lang", "symbols-python"]
symbols-all = [
    "symbols-typescript",
    "symbols-rust-lang",
    "symbols-python",
    "symbols-go",
    "symbols-ruby",
    "symbols-java",
    "symbols-c",
    "symbols-cpp",
    "symbols-csharp",
    "symbols-php",
    "symbols-css",
    "symbols-html",
    "symbols-markdown",
]
lsp = ["dep:lsp-types"]
# Just the terminal wire contract (SessionStatus, TerminalSummary, …): plain
# serde structs, no PTY dependencies. The desktop app decodes daemon payloads
# with this and never links a PTY stack it does not own.
terminal-types = []
terminal = ["terminal-types", "dep:portable-pty", "dep:vte", "dep:nix", "dep:bytes", "dep:libghostty-vt"]
# The CLI drives the terminal daemon (`review terminal …`), so it pulls in the
# connect-side client and the wire types — neither adds PTY dependencies.
cli = ["clap", "daemon-client", "terminal-types"]
# Web-mode HTTP backend. Deliberately does NOT imply `terminal`: web mode has no
# terminals — PTYs live in the `review-daemon` process and only the desktop app
# reaches them.
server = ["axum", "tower-http", "tokio-stream", "notify", "notify-debouncer-mini", "env_logger"]
# Terminal session daemon. `daemon` is the server half (owns the SessionManager,
# so it implies `terminal`); `daemon-client` is the connect side and pulls in no
# PTY dependencies. They compose freely with each other and with `server`.
daemon = ["terminal", "tokio/net", "env_logger"]
daemon-client = ["tokio/net"]

[[bin]]
name = "review"
path = "src/bin/review.rs"
required-features = ["cli"]

[[bin]]
name = "review-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "review-daemon"
path = "src/bin/daemon.rs"
required-features = ["daemon"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# Router-level `oneshot` testing of the web handlers. Already in the tree via
# axum/tower-http; the `util` feature adds `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
