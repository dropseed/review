[package]
name = "review"
version = "0.0.163"
description = "A diff review library and CLI"
license = "FSL-1.1-MIT"
edition = "2021"

[lib]
name = "review"
path = "src/lib.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
glob = "0.3"
urlencoding = "2"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "io-util", "process", "signal", "net"] }
futures = "0.3"
base64 = "0.22"
ignore = "0.4"
regex = "1"
dirs = "6"
tempfile = "3"
anyhow = "1"

# Server dependencies (feature-gated)
axum = { version = "0.8", features = ["ws"], optional = true }
# `set-header` puts `Cache-Control: no-cache` on the SPA's index.html.
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"], optional = true }
# Only for `Layer::layer` — applying that header layer to a bare `ServeFile`,
# which is not a Router and so has no `.layer()` of its own. Already in the tree
# as axum's own dependency.
tower = { version = "0.5", optional = true }
tokio-stream = { version = "0.1", optional = true }
notify = { version = "7", optional = true }
notify-debouncer-mini = { version = "0.5", optional = true }
env_logger = { version = "0.11", optional = true }

# Web Push — behind the `push` feature (see [features]).
#
# `default-features = false` drops the bundled clients: the isahc one links
# libcurl, and the hyper one pins hyper 0.14 + native-tls (a second hyper
# alongside axum's). What remains is the part worth having — VAPID signing and
# aes128gcm encryption — and `push.rs` sends the built message over
# reqwest/rustls. The one C dependency left is unavoidable: `ece` (the
# encryption half) has no backend but OpenSSL, so it is *vendored* below —
# built from source for whatever target is being compiled. The release
# workflow cross-compiles x86_64 from an arm64 runner, where a system OpenSSL
# for the target simply doesn't exist; a dev machine merely stops caring what
# Homebrew has.
web-push = { version = "0.11", default-features = false, optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
# Only for `ES256KeyPair::generate` — web-push reads VAPID keys but cannot mint
# one. Same crate and features web-push itself depends on, so it adds nothing
# to the tree.
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }

# Tree-sitter for symbol extraction
tree-sitter = "0.25"

# Grammar crates (all optional, gated by features)
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-md = { version = "0.3", optional = true }

# Terminal sessions (feature-gated)
portable-pty = { version = "0.8", optional = true }
vte = { version = "0.13", optional = true }
nix = { version = "0.29", features = ["term", "process"], optional = true }
bytes = { version = "1", optional = true }
# VT screen engine — Ghostty's own terminal core. Native, built from the
# `vendor/ghostty` submodule by zig; see CLAUDE.md → "Terminal VT engine".
libghostty-vt = { version = "0.2.1", optional = true }

# LSP client (feature-gated)
lsp-types = { version = "0.97", optional = true }

# CLI dependencies (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
symbols-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
symbols-rust-lang = ["dep:tree-sitter-rust"]
symbols-python = ["dep:tree-sitter-python"]
symbols-go = ["dep:tree-sitter-go"]
symbols-ruby = ["dep:tree-sitter-ruby"]
symbols-java = ["dep:tree-sitter-java"]
symbols-c = ["dep:tree-sitter-c"]
symbols-cpp = ["dep:tree-sitter-cpp"]
symbols-csharp = ["dep:tree-sitter-c-sharp"]
symbols-php = ["dep:tree-sitter-php"]
symbols-css = ["dep:tree-sitter-css"]
symbols-html = ["dep:tree-sitter-html"]
symbols-markdown = ["dep:tree-sitter-md"]
symbols-dev = ["symbols-typescript", "symbols-rust-lang", "symbols-python"]
symbols-all = [
    "symbols-typescript",
    "symbols-rust-lang",
    "symbols-python",
    "symbols-go",
    "symbols-ruby",
    "symbols-java",
    "symbols-c",
    "symbols-cpp",
    "symbols-csharp",
    "symbols-php",
    "symbols-css",
    "symbols-html",
    "symbols-markdown",
]
lsp = ["dep:lsp-types"]
# Just the terminal wire contract (SessionStatus, TerminalSummary, …): plain
# serde structs, no PTY dependencies. The desktop app decodes daemon payloads
# with this and never links a PTY stack it does not own.
terminal-types = []
terminal = ["terminal-types", "dep:portable-pty", "dep:vte", "dep:nix", "dep:bytes", "dep:libghostty-vt"]
# The CLI drives the terminal daemon (`review terminal …`), so it pulls in the
# connect-side client and the wire types — neither adds PTY dependencies.
# `push` is deliberately not in here: it drags a TLS + crypto stack and a
# vendored OpenSSL build into an otherwise light binary. The shipped CLI adds
# it (`scripts/build-cli`, `scripts/cli`) for `review notify`; a bare
# `--features cli` build simply has no such subcommand.
cli = ["clap", "daemon-client", "terminal-types"]
# Web-mode HTTP backend. It pulls in `daemon-client` and the wire types, not
# `terminal`: web mode reaches PTYs the same way the desktop app does — as a
# thin client of the `review-daemon` process — so it gets terminals without
# linking a PTY stack (and therefore without needing Zig).
server = ["axum", "tower", "tower-http", "tokio-stream", "notify", "notify-debouncer-mini", "env_logger", "daemon-client", "terminal-types", "push"]
# Web Push (`push.rs`): the VAPID identity, the subscription store, and the
# HTTP send. The server needs it to register subscriptions (it is what serves
# the service worker); the CLI adds it for `review notify`.
push = ["dep:web-push", "dep:jwt-simple", "dep:reqwest", "dep:openssl"]
# Terminal session daemon. `daemon` is the server half (owns the SessionManager,
# so it implies `terminal`); `daemon-client` is the connect side and pulls in no
# PTY dependencies. They compose freely with each other and with `server`.
daemon = ["terminal", "tokio/net", "env_logger"]
daemon-client = ["tokio/net"]

[[bin]]
name = "review"
path = "src/bin/review.rs"
required-features = ["cli"]

[[bin]]
name = "review-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "review-daemon"
path = "src/bin/daemon.rs"
required-features = ["daemon"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# Router-level `oneshot` testing of the web handlers. Already in the tree via
# axum/tower-http; the `util` feature adds `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
# A WebSocket *client* for the terminal-bridge tests. Already in the tree as
# axum's own `ws` dependency, so this adds no new crates.
tokio-tungstenite = "0.28"
