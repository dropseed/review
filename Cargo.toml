[workspace]
resolver = "2"
members = ["core", "desktop/tauri"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Deny correctness lints — these are almost always bugs
correctness = { level = "deny", priority = -1 }

# Warn on broad lint groups
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# `pedantic` is off, and this is the honest version of what was here before.
#
# It was set to `warn` with an override list underneath, but nothing ever ran
# clippy — so the list was never tested against the code. The first run scored
# 139 pedantic violations in `core` alone, across 30-odd lints that the
# override list does not mention: `needless_pass_by_value` (35),
# `map_unwrap_or` (17), `redundant_closure_for_method_calls` (13),
# `manual_let_else` (8), `implicit_hasher` and `default_trait_access` (6 each),
# and a long tail.
#
# Several of those (`needless_pass_by_value`, `ref_option`) want signature
# changes across the service layer, which is a deliberate design pass and not
# something to fold into turning the gate on. So: off, with the number written
# down. Re-enable a lint at a time, burning down its count.
pedantic = { level = "allow", priority = -1 }

# Restriction lints (opt-in, warn)
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
str_to_string = "warn"
undocumented_unsafe_blocks = "warn"

# Pedantic overrides — kept for when `pedantic` comes back on above
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
similar_names = "allow"

# Cargo lint overrides
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

# Dev builds: fast enough to live in.
#
# The diff pipeline (hunk parsing, linescan, tree-sitter symbol extraction) is
# several-fold slower at opt-level 0, which made `scripts/dev` unusable on large
# comparisons. Dependencies get real optimization — they compile once and are
# where tree-sitter lives — while workspace crates take opt-level 1: most of the
# runtime win at a small incremental-compile cost, so cargo-watch iteration
# stays quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
