# Same gates the Release workflow runs, on every push/PR, so a release
# dispatch is rarely the first time CI sees the code.
#
# Two jobs, because only half of this needs a Mac. The Node and formatting
# gates run on Linux and report in about a minute; the Rust half needs macOS
# because the desktop crate is a macOS Tauri crate and the daemon links the
# zig-built VT engine.

name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing here compiles Rust — `cargo fmt` parses, it does not build — so
  # this needs no Zig, no submodule, and no cargo cache, and it runs beside the
  # macOS job instead of queueing behind ten minutes of it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: desktop

      - name: Pre-commit checks
        run: scripts/pre-commit

      - name: Frontend tests
        run: scripts/test --ts

  # Kept named `test` so the required status check keeps its name.
  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # CI reads backtraces, never a debugger. Line tables keep file and line
      # in a panic while dropping most of what made the cached target/ 2.4 GB,
      # and that size is upload and download time on every single run.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      # No Node setup here: `cargo test -p spur-desktop` compiles the Tauri
      # crate but never runs its beforeBuildCommand, so nothing on this job
      # touches the frontend.
      #
      # --build-sidecars makes the host sidecars that same test needs (Tauri's
      # externalBin wants them on disk) in the dev profile and under the tests'
      # own feature set, so they share target/debug with the test build instead
      # of pulling a second, release-profile build of the dependency tree into
      # the job and its cache.
      - name: Tests
        run: scripts/test --rust --build-sidecars
